body{display:block;padding:0;background:#101b2c}.game{width:100vw;height:100vh;min-width:280px;min-height:498px;border:0;border-radius:0;box-shadow:none}.screen#settings{background:rgba(10,22,38,.68);backdrop-filter:blur(5px);z-index:20}.screen#settings .card{width:min(360px,calc(100% - 32px));max-height:calc(100% - 32px);border:3px solid #13253b;border-radius:18px;box-shadow:0 14px 32px rgba(0,0,0,.35)}.screen#home .card{justify-content:center;padding:96px 20px 32px}.screen#home .brand,.screen#home h1{transform:none}.screen#home .menu-actions{order:6;position:static;display:flex;width:min(280px,90%);margin:0 auto;grid-template-columns:none;gap:12px;justify-content:center;transform:translateY(64px)}.screen#home .menu-actions button{flex:1;min-width:0;padding:10px 8px;font-size:12px}.screen#home .primary{margin-bottom:12px;transform:translateY(64px)}.screen#shop{overflow-x:hidden;overflow-y:auto}.screen#shop .card{width:min(520px,calc(100% - 24px));max-width:100%;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}.screen#shop .card::-webkit-scrollbar{display:none}.screen#shop #items{width:100%;max-width:100%;grid-template-columns:repeat(2,minmax(0,1fr));overflow-x:hidden}.screen#shop .item{min-width:0;overflow:hidden}.screen#shop .item h3,.screen#shop .item p{overflow-wrap:anywhere}.screen#shop .bird-preview{max-width:100%;height:auto}

<body>
<main class="game" id="game"><canvas id="canvas" aria-label="Sky Hop gameplay"></canvas><div class="hud"><div class="hud-left"><div class="coin-pill"><span class="coin-icon">$</span><span id="coins">0</span></div></div><div class="score-box"><strong id="score">0</strong><small>SCORE</small><div class="best-line">BEST <span id="best">0</span></div></div><div class="hud-right"><div class="flight-pill">✈ <span id="flights">0</span></div><button class="icon-btn" id="soundBtn" aria-label="Toggle sound">🔊</button><button class="icon-btn" id="pauseBtn" aria-label="Pause game">Ⅱ</button></div></div>

<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),game=$('game'),screens=['home','pause','result','shop','rewards','settings'];const catalog=[['sunny','Sunny','skin','Common',0,'#f5c857'],['cloud','Cloud','skin','Common',50,'#f4f1dc'],['mint','Mint','skin','Uncommon',80,'#80cfa4'],['peach','Peach','skin','Uncommon',100,'#f49b78'],['berry','Berry','skin','Rare',150,'#d46b83'],['ocean','Ocean','skin','Rare',180,'#4d91c7'],['forest','Forest','skin','Uncommon',90,'#2d5016'],['sunset','Sunset','skin','Rare',170,'#ff6b35'],['lavender','Lavender','skin','Uncommon',120,'#b19cd9'],['gold','Gold Rush','skin','Legendary',400,'#ffd700'],['royal','Royal Blue','costume','Legendary',300,'#1e40af'],['ember','Ember','costume','Legendary',350,'#e85b3f'],['platinum','Platinum','costume','Legendary',450,'#e5e4e2'],['neon','Neon','costume','Legendary',380,'#00ff00'],['cap','Pilot cap','hat','Common',60,'#e56b4f'],['flower','Flower crown','hat','Uncommon',130,'#e6a6c5'],['crown','Crown','hat','Rare',250,'#e7b35d'],['halo','Star halo','hat','Legendary',400,'#f5c857'],['tophat','Top hat','hat','Rare',230,'#2c2c2c'],['witch','Witch hat','hat','Uncommon',140,'#4a148c'],['ninja','Ninja mask','hat','Rare',250,'#1a1a1a'],['santa','Santa hat','hat','Uncommon',150,'#dc143c']];const base={best:0,coins:0,flights:0,owned:['sunny'],equipped:'sunny',hat:null,sound:true,reviveUsed:false,adUnlocks:{}};let state={...base,...JSON.parse(localStorage.getItem('skyHopState')||'{}')};state.owned=state.owned||['sunny'];state.adUnlocks=state.adUnlocks||{};let daily={date:new Date().toDateString(),pipes:0,score:0,coins:0,games:0,claimed:{},daily50Claimed:false};const saved=JSON.parse(localStorage.getItem('skyHopDaily')||'null');if(saved&&saved.date===daily.date)daily=saved;const goals=[['pipes','Fly through 20 pipes',20,40],['score','Reach a score of 30',30,60],['coins','Collect 100 coins',100,75],['games','Play 5 games',5,50]];let width,height,bird,pipes,coins,score,running,p <script>
// Ad SDK Integration - uses Google Mobile Ads SDK
const REWARDED_AD_UNIT = 'ca-app-pub-7903401116151588/2411240568';
let adOverlayTimer = null;

function showAdOverlay(text){
  const overlay = $('adOverlay');
  const label = $('adOverlayText');
  if (!overlay || !label) return;
  label.textContent = text || 'Please wait…';
  overlay.classList.remove('hidden');
}

function hideAdOverlay(){
  const overlay = $('adOverlay');
  if (overlay) overlay.classList.add('hidden');
}

function completeRewardedAd(){
  hideAdOverlay();
  const reward = adCallbacks.reward;
  adCallbacks.reward = null;
  if (reward) reward();
}

function showRewardedAd(callback){
  adCallbacks.reward = callback;
  showAdOverlay(`Rewarded ad: ${REWARDED_AD_UNIT}. Reward unlocks after completion.`);

  if (window.google && window.google.gax) {
    google.gax.signalToHost('show_ad', {
      ad_type: 'rewarded',
      ad_unit_id: REWARDED_AD_UNIT
    });
    if (adOverlayTimer) clearTimeout(adOverlayTimer);
    adOverlayTimer = setTimeout(() => {
      if (adCallbacks.reward) {
        completeRewardedAd();
      }
    }, 5000);
    return;
  }

  console.log('Ad SDK not available, showing the test ad flow locally.');
  if (adOverlayTimer) clearTimeout(adOverlayTimer);
  adOverlayTimer = setTimeout(() => {
    completeRewardedAd();
  }, 4000);
}

window.initAds=function(){if(window.google&&window.google.gax){google.gax.signalToHost('register',{nonce:Math.random()})}}
window.adSDKReady=function(result){
  if (result && result.type === 'rewarded') {
    completeRewardedAd();
  }
};
window.simulateAdReward=function(){
  completeRewardedAd();
};
